[tool.poetry]
name = "revivoai"
version = "0.1.0"
description = "Legacy code modernization tool"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    {include = "backend"},
    {include = "frontend"}
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
nicegui = ">=3.3.1"
Pygments = ">=2.17.0"
langgraph = ">=0.2.0"
docker = "*"
supabase = "*"
fastapi = "*"
httpx = "*"
websockets = "*"
google-genai = "^2.16.0"
python-dotenv = "^1.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*'_UnionGenericAlias' is deprecated.*:DeprecationWarning:google.genai.*",
    "ignore::DeprecationWarning:supabase.*:"
]
